    <script>
        // 1. FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyD4sgRYUhk08Y4oZPR4GXJbSuX1fHjXBtg",
            authDomain: "akinowedding-73271.firebaseapp.com",
            projectId: "akinowedding-73271",
            storageBucket: "akinowedding-73271.appspot.com",
            messagingSenderId: "307666594440",
            appId: "1:307666594440:web:e7d3496744464f4c6d0d3d"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. KONFIGURASI WORKER CLOUDFLARE ANDA
        const SMM_API_URL = 'https://sosmed.tsalonikabagas.workers.dev/'; 
        
        // Batasi hanya admin yang bisa masuk
        const ADMIN_UID = "g2wfEDQ6niUfI3UEjRFh4GUtxvp1";

        // 3. LOGIKA LOGIN
        function loginAdmin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert('Login gagal: ' + err.message));
        }
        function logoutAdmin() {
            auth.signOut();
        }

        auth.onAuthStateChanged(user => {
            if (user && user.uid === ADMIN_UID) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadOrders();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        });

        // 4. LOGIKA TAB (Sama seperti sebelumnya)
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tabName === 'orders') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('tab-orders').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('tab-generator').classList.add('active');
            }
        }

        // 5. LOAD DATA PESANAN DARI FIREBASE (Sama seperti sebelumnya)
        function loadOrders() {
            const listEl = document.getElementById('order-list');
            listEl.innerHTML = '<p style="text-align:center; color:var(--muted);"><i class="fas fa-spinner fa-spin"></i> Memuat pesanan...</p>';

            db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                let html = '';
                let stats = { pending: 0, processing: 0, completed: 0 };

                if (snapshot.empty) {
                    listEl.innerHTML = '<p style="text-align:center; color:var(--muted);">Belum ada pesanan.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    
                    if (stats[data.status] !== undefined) stats[data.status]++;

                    const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString('id-ID') : '-';
                    
                    let badgeClass = 'status-pending';
                    if (data.status === 'processing') badgeClass = 'status-processing';
                    if (data.status === 'completed') badgeClass = 'status-completed';

                    let actionBtn = '';
                    if (data.status === 'pending' || data.status === 'paid') {
                        actionBtn = `<button class="btn btn-process" onclick="processToSMM('${id}', ${data.serviceId}, '${data.link}', ${data.quantity})"><i class="fas fa-play"></i> Proses ke SMM</button>`;
                    } else if (data.status === 'processing') {
                        actionBtn = `<span style="color:var(--muted); font-size:0.8rem;">Diproses (ID SMM: ${data.smmOrderId || '-'})</span>`;
                    }

                    html += `
                        <div class="order-card">
                            <div class="order-info">
                                <h4>${data.serviceName || 'Layanan Tidak Diketahui'}</h4>
                                <div class="order-meta">
                                    <span><i class="fas fa-user"></i> ${data.customerName}</span>
                                    <span><i class="fab fa-whatsapp"></i> ${data.customerWA}</span>
                                    <span><i class="fas fa-hashtag"></i> ${data.quantity.toLocaleString('id-ID')}</span>
                                    <span style="color:var(--accent)"><i class="fas fa-money-bill"></i> Rp ${(data.total || 0).toLocaleString('id-ID')}</span>
                                </div>
                                <div class="order-meta">
                                    <span><i class="fas fa-link"></i> <a href="${data.link}" target="_blank">${data.link}</a></span>
                                </div>
                                <div class="order-meta">
                                    <span><i class="fas fa-clock"></i> ${date}</span>
                                    <span class="status-badge ${badgeClass}">${data.status}</span>
                                </div>
                            </div>
                            <div class="actions">
                                ${actionBtn}
                            </div>
                        </div>
                    `;
                });

                listEl.innerHTML = html;
                
                document.getElementById('stats-container').innerHTML = `
                    <div class="stat-box"><h3>${stats.pending}</h3><p>Pending (Perlu Diproses)</p></div>
                    <div class="stat-box"><h3>${stats.processing}</h3><p>Processing (Berjalan)</p></div>
                    <div class="stat-box"><h3>${stats.completed}</h3><p>Selesai</p></div>
                `;
            });
        }

        // 6. FUNGSI PROSES KE SMM PANEL (VIA WORKER)
        async function processToSMM(docId, serviceId, link, quantity) {
            if (!confirm('Pastikan pembayaran user sudah masuk ke rekening Anda.\n\nProses pesanan ini ke SMM Panel sekarang?')) return;

            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

            try {
                // Tembak Worker dengan format JSON
                const response = await fetch(SMM_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'add',
                        service: serviceId,
                        link: link,
                        quantity: quantity
                    })
                });

                const result = await response.json();

                if (result.order) {
                    await db.collection("orders").doc(docId).update({
                        status: 'processing',
                        smmOrderId: result.order,
                        processedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    alert(`✅ BERHASIL! Pesanan telah masuk ke SMM Panel.\nOrder ID SMM: ${result.order}`);
                } else {
                    alert(`❌ GAGAL DARI SMM PANEL: ${result.error || 'Terjadi kesalahan'}`);
                }
            } catch (error) {
                console.error(error);
                alert(`❌ ERROR JARINGAN: ${error.message}\nCek koneksi internet atau pastikan Worker sudah di-deploy dengan benar.`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // 7. FUNGSI GENERATE KODE UNTUK FRONTEND (VIA WORKER)
        async function generateFrontendCode() {
            const btn = document.getElementById('btn-generate');
            const output = document.getElementById('code-output');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menarik Data...';
            output.value = 'Menghubungi Worker Cloudflare...';

            try {
                const response = await fetch(SMM_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'services' })
                });

                const rawServices = await response.json();
                
                if (Array.isArray(rawServices)) {
                    output.value = 'Memproses harga +30%...';
                    
                    const formattedServices = rawServices.map(srv => {
                        const originalRate = parseFloat(srv.rate);
                        const markedUpRate = Math.ceil(originalRate * 1.3); // +30%

                        let category = srv.category.toLowerCase();
                        if (category.includes('instagram')) category = 'instagram';
                        else if (category.includes('tiktok')) category = 'tiktok';
                        else if (category.includes('youtube')) category = 'youtube';
                        else if (category.includes('facebook')) category = 'facebook';
                        else if (category.includes('telegram')) category = 'telegram';
                        else if (category.includes('twitter')) category = 'twitter';
                        else if (category.includes('shopee')) category = 'shopee';
                        else if (category.includes('spotify')) category = 'spotify';
                        else category = 'lainnya';

                        return {
                            id: parseInt(srv.service),
                            category: category,
                            name: srv.name,
                            min: parseInt(srv.min),
                            max: parseInt(srv.max),
                            rate: markedUpRate,
                            tags: [] 
                        };
                    });

                    const finalCode = `var SERVICES = ${JSON.stringify(formattedServices, null, 2)};`;
                    output.value = finalCode;
                    alert('✅ Berhasil! Silakan klik "Salin Kode" dan tempel di SosialMedia.html');
                } else {
                    output.value = 'Gagal: Respon API tidak valid. ' + JSON.stringify(rawServices);
                }
            } catch (error) {
                console.error(error);
                output.value = 'Error: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-magic"></i> Tarik API & Generate Kode';
            }
        }

        function copyCode() {
            const output = document.getElementById('code-output');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            alert('Kode berhasil disalin!');
        }
    </script>
</body>
</html>
